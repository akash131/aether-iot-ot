{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "iot.name" . }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{ hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.ingress.tlsSecret }} }]
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ include "iot.name" . }}, port: { name: http } } } }]
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iot.name" . }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: {{ include "iot.name" . }} } }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8096 }]
{{- end }}
