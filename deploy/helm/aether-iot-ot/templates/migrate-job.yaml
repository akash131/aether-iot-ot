apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "iot.name" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "iot.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 10008 }
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["migrate"]
          env: {{- include "iot.env" . | nindent 12 }}
