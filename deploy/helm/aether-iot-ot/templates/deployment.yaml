apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iot.name" . }}
  labels: {{- include "iot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 25% }
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "iot.name" . }}, component: api }
  template:
    metadata:
      labels: {{- include "iot.labels" . | nindent 8 }}
        component: api
    spec:
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, runAsUser: 10008, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: {{ include "iot.name" . }}, component: api } }
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports: [{ name: http, containerPort: 8096 }]
          env:
            {{- include "iot.env" . | nindent 12 }}
            - name: IOT_WORKERS
              value: {{ if .Values.config.separateWorkers }}"false"{{ else }}"true"{{ end }}
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
{{- if .Values.config.separateWorkers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iot.name" . }}-workers
  labels: {{- include "iot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workers.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "iot.name" . }}, component: workers }
  template:
    metadata:
      labels: {{- include "iot.labels" . | nindent 8 }}
        component: workers
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10008, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: workers
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["serve"]
          env:
            {{- include "iot.env" . | nindent 12 }}
            - name: IOT_WORKERS
              value: "true"
            - name: IOT_BIND
              value: 0.0.0.0:8096
          readinessProbe: { httpGet: { path: /health/ready, port: 8096 }, periodSeconds: 10 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
{{- end }}
