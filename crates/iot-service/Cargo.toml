[package]
name = "iot-service"
description = "Aether IoT/OT Security service: control-plane API, ingestion and classification pipeline, risk, segmentation, OT remote access, workers, and the edge collector/enforcer node"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aether-iot"
path = "src/main.rs"

[dependencies]
aether-core.workspace = true
aether-kit.workspace = true
iot-core = { path = "../iot-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
tracing.workspace = true
rand.workspace = true
bytes.workspace = true
futures-util.workspace = true
async-trait.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
tower-http = { version = "0.6", features = ["request-id", "catch-panic", "limit", "timeout", "cors"] }
percent-encoding = "2"
dashmap = "6"
prometheus = "0.13"

[dev-dependencies]
jsonwebtoken = "9"
ring = "0.17"
